name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Nightly rebuild (09:00 UTC = 3/4 AM Chicago) so barbers added/removed in Square appear by
  # morning. Only does anything once the SQUARE_TOKEN secret exists (see README "Square roster").
  schedule:
    - cron: '0 9 * * *'
  # Instant rebuild when a barber, price, service, team member or shop hours change in Square.
  # Fired by the Cloudflare relay Worker (site/worker, spec section 10) as event_type `square-catalog`.
  # A burst of events queues behind the running build (concurrency below), it never cancels a deploy.
  repository_dispatch:
    types: [square-catalog]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Custom domain (cutover): https://skullandthrones.com/ (public/CNAME holds the same host).
  # ROLLBACK to the project site (https://awaisqazi.github.io/skull-and-thrones-mockups/) is one edit:
  # swap these two lines for the commented pair below, and delete the cutover custom domain in repo Pages settings.
  #   BASE_PATH: /skull-and-thrones-mockups
  #   SITE_URL: https://awaisqazi.github.io
  BASE_PATH: /
  SITE_URL: https://skullandthrones.com

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Square roster (src/content.config.ts). Unset secrets = empty strings = build uses
      # src/data/barbers.json as before. Build-time only; never exposed to the browser.
      # SQUARE_TOKEN = the main account (Addison). Elmhurst books through a separate Square account,
      # so SQUARE_TOKEN_ELMHURST overrides it for that shop (spec §9). SQUARE_TOKEN_ADDISON is unused.
      SQUARE_TOKEN: ${{ secrets.SQUARE_TOKEN }}
      SQUARE_TOKEN_ADDISON: ${{ secrets.SQUARE_TOKEN_ADDISON }}
      SQUARE_TOKEN_ELMHURST: ${{ secrets.SQUARE_TOKEN_ELMHURST }}
      # Retail products source for /shop/ and the home strip (spec §5): `bodega` = src/data/products.json
      # (Bodega's Shopify feed, as today). `square` = the shops' Square catalogs, once the production tokens
      # exist and the retail route (S1/S2) is decided. Anything else behaves like `bodega`.
      SHOP_SOURCE: bodega
      # Live availability file the browser fetches (written every 15 min by availability.yml to branch `data`).
      PUBLIC_AVAILABILITY_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/availability.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (roster merge, Square clients, availability rules; no network)
        run: npm test
      - name: Worker unit tests (webhook relay + cron dispatcher, site/worker; no network)
        run: node --test "worker/test/*.test.mjs"
      - name: Bake the latest availability snapshot (branch `data`; keeps the checked-in empty default if absent)
        run: |
          if git fetch --depth=1 origin data 2>/dev/null && git show FETCH_HEAD:availability.json > "$RUNNER_TEMP/availability.json" 2>/dev/null \
             && node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).shops || process.exit(1)' "$RUNNER_TEMP/availability.json"; then
            cp "$RUNNER_TEMP/availability.json" src/data/availability.json
            echo "baked availability.json from branch data"
          else
            echo "no usable availability.json on branch data: chips render from the live file only (or not at all)"
          fi
      - name: Build with Astro and upload the Pages artifact
        uses: withastro/action@v3
        with:
          # This workflow assumes the Astro project is the repo root. If the repo root is the
          # parent folder instead, move this file to <root>/.github/workflows/ and set `path: site`.
          path: .
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
