name: Refresh live availability

# Every 15 minutes during shop hours: ask Square when each barber is next free and publish
# availability.json on the one-commit branch `data`. The site fetches it from
#   https://raw.githubusercontent.com/<owner>/<repo>/data/availability.json
# (spec docs/SQUARE-INTEGRATION-SPEC.md §2–§3). Costs nothing: public repo Actions minutes are free.
# Fails loudly: when Square rejects a shop's token (HTTP 401/403) the job still publishes the file (that shop keeps
# its last good block with ok:false, which the site hides after 2 h) and then fails, so GitHub emails the repo owner.

on:
  workflow_dispatch: {}
  # Fired by the Square webhook relay Worker (site/worker/, spec §10) on booking.* events, so a new or
  # cancelled booking shows within a minute instead of at the next 15-minute tick. The same Worker is also the
  # primary 15-minute clock once deployed (Cloudflare Cron Triggers, client_payload.reason = "cron"): GitHub's own
  # schedule below is best-effort (on 2026-10-28 it fired 0 times in 5.5 h) and stays only as a backstop.
  repository_dispatch:
    types: [square-booking]
  schedule:
    # Shop hours are 07:00–20:00 America/Chicago. GitHub cron is UTC and has no time zones, so these two
    # lines cover the union of both DST states: 12:00–02:59 UTC = 07:00–21:59 CDT (summer, UTC-5) and
    # 06:00–20:59 CST (winter, UTC-6). The "Shop-hours guard" step below drops runs outside 07:00–20:59
    # Chicago time, so the effective window is the same all year. Scheduled runs often start 5–15 min late;
    # the site tolerates up to 2 h of age before it hides the chips.
    - cron: '*/15 12-23 * * *'
    - cron: '*/15 0-2 * * *'

permissions:
  contents: write # force-push the `data` branch

# A burst of booking events (or a dispatch during a scheduled run) collapses into the newest run: every run
# reads Square fresh, so the cancelled one had nothing the new one will not have.
concurrency:
  group: availability
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # SQUARE_TOKEN = the main account (Addison). Elmhurst books through a separate Square account,
      # so SQUARE_TOKEN_ELMHURST overrides it for that shop (spec §9). SQUARE_TOKEN_ADDISON is unused.
      SQUARE_TOKEN: ${{ secrets.SQUARE_TOKEN }}
      SQUARE_TOKEN_ADDISON: ${{ secrets.SQUARE_TOKEN_ADDISON }}
      SQUARE_TOKEN_ELMHURST: ${{ secrets.SQUARE_TOKEN_ELMHURST }}
    steps:
      - name: Shop-hours guard (America/Chicago 07:00–20:59; manual and booking-event runs always go, cron ticks from GitHub or the Worker do not)
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          REASON: ${{ github.event.client_payload.reason }}
        run: |
          hour=$(TZ=America/Chicago date +%H)
          always=false
          if [ "$EVENT" = "workflow_dispatch" ]; then always=true; fi
          if [ "$EVENT" = "repository_dispatch" ] && [ "$REASON" != "cron" ]; then always=true; fi
          if [ "$always" = "true" ] || { [ "$hour" -ge 7 ] && [ "$hour" -le 20 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Outside shop hours in Chicago (hour $hour); nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tokens present?
        id: tokens
        if: steps.guard.outputs.run == 'true'
        run: |
          if [ -z "$SQUARE_TOKEN" ] && [ -z "$SQUARE_TOKEN_ADDISON" ] && [ -z "$SQUARE_TOKEN_ELMHURST" ]; then
            echo "No SQUARE_TOKEN secret yet (spec §9): nothing to fetch, nothing published."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.tokens.outputs.go == 'true'

      - uses: actions/setup-node@v4
        if: steps.tokens.outputs.go == 'true'
        with:
          node-version: 22 # 22.18+ runs the src/lib/*.ts modules directly; no npm install needed

      - name: Previous file from the data branch (a failing shop keeps its last good block)
        if: steps.tokens.outputs.go == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          if git fetch --depth=1 origin data 2>/dev/null && git show FETCH_HEAD:availability.json > "$RUNNER_TEMP/previous.json" 2>/dev/null; then
            echo "previous file found"
          else
            echo '{"shops":{}}' > "$RUNNER_TEMP/previous.json"
            echo "no data branch yet: starting empty"
          fi

      # Exit 0 = published as usual (a 5xx/network failure for a shop is recorded in the file). Exit 2 = a token was
      # rejected: the file was still written, so publish it, then fail the job in the last step. Anything else
      # (1 = file not written / bad arguments) fails here and publishes nothing.
      - name: Fetch availability from Square
        id: fetch
        if: steps.tokens.outputs.go == 'true'
        run: |
          set +e
          node scripts/fetch-availability.mjs --previous "$RUNNER_TEMP/previous.json" --out "$RUNNER_TEMP/out/availability.json"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi

      - name: Publish to the one-commit branch `data`
        if: steps.tokens.outputs.go == 'true' && (steps.fetch.outputs.code == '0' || steps.fetch.outputs.code == '2')
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add availability.json
          msg="availability $(date -u +%Y-%m-%dT%H:%MZ)"
          if git fetch -q --depth=1 origin data 2>/dev/null; then
            # Point `data` at its single existing commit (index keeps the new file), then amend it,
            # so the branch never grows a history.
            git reset -q --soft FETCH_HEAD
            git commit -q --amend -m "$msg"
          else
            git commit -q -m "$msg" # first run: the orphan branch is born here
          fi
          git push -q -f origin data
          echo "published $(wc -c < availability.json) bytes to branch data ($(git rev-list --count HEAD) commit)"

      - name: Fail on a rejected Square token (GitHub emails the repo owner)
        # always(): the annotation must show even when the publish step failed on the same run.
        if: always() && steps.fetch.outputs.code == '2'
        run: |
          echo "::error title=Square token rejected::A shop's Square token was rejected (HTTP 401/403). The AUTH FAILURE line in the 'Fetch availability from Square' step names the shop and the secret to rotate (repo Settings → Secrets → Actions). The file was still published; that shop's chips hide after 2 h."
          exit 1
